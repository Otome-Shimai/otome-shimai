<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Walkthroughs — Otome Shimai</title>
<meta name="description" content="Text walkthroughs for otome games from the Otome Shimai podcast — routes, choices, and endings.">
<link rel="icon" href="../assets/icons/favicon.png">
<meta name="theme-color" content="#23b4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.1rem;
    margin-top: 1.4rem;
  }
  .game-card {
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s;
  }
  .game-card:hover { transform: translateY(-3px); }
  .game-card h2 { margin: 0 0 0.4rem; font-size: 1.25rem; }
  .game-card p { margin: 0 0 0.6rem; font-size: 0.95rem; }
  .game-card .updated { font-size: 0.82rem; color: var(--muted); }
  .game-card .tag {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #1b8fd0;
    font-family: var(--font-display);
  }
</style>
</head>
<body>

<nav class="mini-nav">
  <div class="inner">
    <a href="../"><img src="../assets/cover.jpg" alt="Otome Shimai"></a>
    <a class="home" href="../">Otome Shimai</a>
    <span class="crumb">/ Walkthroughs</span>
  </div>
</nav>

<main class="wrap">
  <h1 class="section-title" style="font-size:2rem; margin-top:2rem;">Game Walkthroughs</h1>
  <p>Our text walkthroughs for the otome games we play on the podcast — full routes,
    choice-by-choice guides, and how to unlock every ending.</p>
  <div id="grid" class="grid"><p class="muted">Loading…</p></div>
</main>

<footer class="site-footer">
  <p style="margin:0;">✿ <a href="../">Back to Otome Shimai</a> ✿</p>
</footer>

<script>
(async () => {
  const grid = document.getElementById("grid");
  try {
    const games = await (await fetch("games.json")).json();
    grid.innerHTML = "";
    if (!games.length) {
      grid.innerHTML = '<p class="muted">No walkthroughs yet — check back soon!</p>';
      return;
    }
    for (const g of games) {
      const a = document.createElement("a");
      a.className = "game-card card";
      a.href = `view.html?game=${encodeURIComponent(g.slug)}`;
      a.innerHTML = `<h2></h2><p></p><span class="updated"></span><span class="tag">Read the walkthrough →</span>`;
      a.querySelector("h2").textContent = "✿ " + g.title;
      a.querySelector("p").textContent = g.summary;
      a.querySelector(".updated").textContent = g.updated ? "Updated " + g.updated : "";
      grid.appendChild(a);
    }
  } catch (err) {
    grid.innerHTML = '<p class="muted">Couldn\'t load the walkthrough list.</p>';
  }
})();
</script>
</body>
</html>
