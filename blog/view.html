<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough — Otome Shimai</title>
<link rel="icon" href="../assets/icons/favicon.png">
<meta name="theme-color" content="#23b4ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
  article.card { margin-top: 2rem; padding: 2rem 2.2rem; }
  article h1 { font-size: 2rem; margin-top: 0; }
  article h2 {
    font-size: 1.4rem;
    margin-top: 2rem;
    padding-bottom: 0.3rem;
    border-bottom: 2px solid var(--sky-soft);
  }
  article h2::before { content: "✿ "; color: var(--sky); }
  article h3 { font-size: 1.15rem; margin-top: 1.5rem; }
  article code {
    background: var(--sky-soft);
    border-radius: 6px;
    padding: 0.1em 0.4em;
    font-size: 0.9em;
  }
  article pre {
    background: var(--sky-soft);
    border-radius: 12px;
    padding: 1rem 1.2rem;
    overflow-x: auto;
  }
  article pre code { background: none; padding: 0; }
  article blockquote {
    margin: 1rem 0;
    padding: 0.6rem 1.2rem;
    border-left: 4px solid var(--sky);
    background: var(--sky-soft);
    border-radius: 0 12px 12px 0;
  }
  article blockquote p { margin: 0.3rem 0; }
  article table { border-collapse: collapse; width: 100%; margin: 1rem 0; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid #d8ecfa; padding: 0.45rem 0.8rem; text-align: left; }
  article th { background: var(--sky-soft); font-family: var(--font-display); font-weight: 500; }
  article img { max-width: 100%; border-radius: 12px; }
  /* a screenshot on its own line renders as a figure — see md.js */
  article figure { margin: 1.6rem 0; text-align: center; }
  article figure img { box-shadow: var(--shadow); }
  article figcaption {
    font-size: 0.85rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 0.5rem;
  }
  article hr { border: none; border-top: 2px dashed var(--sky-soft); margin: 2rem 0; }
  article h5 { font-size: 1.02rem; margin-top: 1.2rem; }
  article h6 { font-size: 0.95rem; margin-top: 1.2rem; color: var(--muted); }
  /* task-list items render as real (disabled) checkboxes — see md.js */
  article li.task-list-item { list-style: none; margin-left: -1.35em; }
  article li.task-list-item input { margin-right: 0.4em; accent-color: var(--sky); }
  article kbd {
    background: var(--sky-soft);
    border: 1px solid #d8ecfa;
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 0.05em 0.4em;
    font-size: 0.85em;
  }
  article .footnotes { font-size: 0.88rem; color: var(--muted); }
  article .footnotes hr { margin: 2.5rem 0 0.8rem; }
  .backlink { margin: 1.5rem 0; display: inline-block; }
  @media (max-width: 640px) { article.card { padding: 1.4rem 1.2rem; } }
</style>
</head>
<body>

<nav class="mini-nav">
  <div class="inner">
    <a href="../"><img src="../assets/cover.jpg" alt="Otome Shimai"></a>
    <a class="home" href="../">Otome Shimai</a>
    <span class="crumb">/ <a href="./" style="color:rgba(255,255,255,.85)">Blog</a></span>
  </div>
</nav>

<main class="wrap">
  <article id="content" class="card">
    <p class="muted">Loading post…</p>
  </article>
  <a class="backlink pill" href="./">← All posts</a>
</main>

<footer class="site-footer">
  <p style="margin:0;">✿ <a href="../">Back to Otome Shimai</a> ✿</p>
</footer>

<script src="../md.js?v=4"></script>
<script>
(async () => {
  const box = document.getElementById("content");
  const params = new URLSearchParams(location.search);
  const slug = params.get("post") || params.get("game"); // "game" kept for old links
  if (!slug || !/^[\w-]+$/.test(slug)) {
    box.innerHTML = '<p class="muted">No post selected — pick one from the <a href="./">blog</a>.</p>';
    return;
  }
  try {
    const [mdRes, posts] = await Promise.all([
      fetch(slug + ".md"),
      fetch("posts.json").then(r => r.json()).catch(() => []),
    ]);
    if (!mdRes.ok) throw new Error("HTTP " + mdRes.status);
    const meta = posts.find(p => p.slug === slug);
    if (meta) document.title = meta.title + " — Otome Shimai";
    box.innerHTML = mdToHtml(await mdRes.text());
  } catch (err) {
    box.innerHTML = '<p class="muted">Couldn\'t find that post — try the <a href="./">blog</a>.</p>';
  }
})();
</script>
</body>
</html>
